name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: amrutam_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amrutam_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/schema.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amrutam_test
      - run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/amrutam_test
          JWT_SECRET: ci_test_secret_at_least_32_characters_long
          MFA_ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
          PORT: 3000
      - run: npm run test:integration
        env:
          NODE_ENV: test
          LOG_LEVEL: silent
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amrutam_test
          JWT_SECRET: ci_test_secret_at_least_32_characters_long
          MFA_ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      - run: npm audit --audit-level=high
      - run: docker build -t amrutam-api:ci .
